services:
  app:
    image: commons:${IMAGE_TAG:-local}
    build: .
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /data/commons.sqlite
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL to the public HTTPS origin}
      OPERATOR_NAME: ${OPERATOR_NAME:?Set OPERATOR_NAME to the public operator identity}
      CONTACT_EMAIL: ${CONTACT_EMAIL:?Set CONTACT_EMAIL to a monitored public contact email}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Commons}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - data:/data
      - ${BACKUP_DIR:-./backups}:/backups
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
